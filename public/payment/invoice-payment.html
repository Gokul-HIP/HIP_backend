<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>Invoice Payment</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@500;700&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #f3f6fb;
      --card: #ffffff;
      --text: #0f172a;
      --muted: #64748b;
      --line: #e2e8f0;
      --primary: #0b69ff;
      --accent: #f97316;
      --ok: #16a34a;
      --danger: #dc2626;
    }

    * { box-sizing: border-box; }
    body {
      margin: 0;
      background: radial-gradient(1200px 400px at 50% -150px, #dbeafe 0%, var(--bg) 70%);
      font-family: 'Plus Jakarta Sans', sans-serif;
      color: var(--text);
      -webkit-font-smoothing: antialiased;
    }

    .app {
      max-width: 480px;
      margin: 0 auto;
      min-height: 100vh;
      padding-bottom: 96px;
    }

    .sticky-header {
      position: sticky;
      top: 0;
      z-index: 20;
      background: rgba(243, 246, 251, 0.92);
      backdrop-filter: blur(8px);
      padding: 12px;
      border-bottom: 1px solid #dbe3f0;
    }

    .banner {
      background: linear-gradient(135deg, #0b69ff, #3182f6);
      color: #fff;
      border-radius: 14px;
      padding: 14px;
      box-shadow: 0 8px 20px rgba(11, 105, 255, 0.22);
      transform: translateY(8px);
      opacity: 0;
      animation: fadeInUp .45s ease forwards;
    }

    .banner h1 { margin: 0; font-size: 16px; }
    .banner p { margin: 6px 0 0; font-size: 12px; opacity: 0.95; }

    .wrap {
      padding: 14px 12px 0;
      display: grid;
      gap: 12px;
    }

    .card {
      background: var(--card);
      border: 1px solid var(--line);
      border-radius: 14px;
      padding: 14px;
      box-shadow: 0 2px 8px rgba(15, 23, 42, 0.04);
      animation: fadeInUp .35s ease both;
    }

    .row { display: flex; justify-content: space-between; gap: 8px; }
    .muted { color: var(--muted); font-size: 12px; }
    .mono { font-family: 'JetBrains Mono', monospace; }

    .tags { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 10px; }
    .tag {
      font-size: 11px;
      font-weight: 700;
      padding: 4px 8px;
      border-radius: 999px;
      text-transform: uppercase;
      letter-spacing: .03em;
    }
    .t-procedure { background: #dbeafe; color: #1d4ed8; }
    .t-labtest { background: #e0f2fe; color: #0369a1; }
    .t-package { background: #ede9fe; color: #6d28d9; }
    .t-pharmacy { background: #dcfce7; color: #166534; }

    .pill {
      display: inline-flex;
      align-items: center;
      font-size: 11px;
      font-weight: 700;
      background: #fff7ed;
      color: #c2410c;
      padding: 4px 8px;
      border-radius: 999px;
      border: 1px solid #fed7aa;
    }

    .item {
      border: 1px solid #edf2f7;
      border-radius: 10px;
      padding: 10px;
      margin-top: 8px;
      background: #fcfdff;
    }

    .summary-row {
      display: flex;
      justify-content: space-between;
      font-size: 13px;
      padding: 5px 0;
    }
    .summary-total {
      border-top: 1px dashed #d7e0eb;
      margin-top: 8px;
      padding-top: 8px;
      font-weight: 800;
      font-size: 16px;
    }

    .coin-card {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
    }

    .switch {
      width: 54px;
      height: 32px;
      border-radius: 999px;
      background: #d0d7e2;
      position: relative;
      cursor: pointer;
      transition: all .2s ease;
    }
    .switch::after {
      content: '';
      width: 26px;
      height: 26px;
      border-radius: 50%;
      background: #fff;
      position: absolute;
      top: 3px;
      left: 3px;
      transition: all .2s ease;
      box-shadow: 0 2px 6px rgba(15, 23, 42, 0.2);
    }
    .switch.on { background: #fb923c; }
    .switch.on::after { left: 25px; }

    .methods {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 8px;
      margin-top: 8px;
    }
    .method {
      border: 1px solid #dbe4ee;
      border-radius: 10px;
      padding: 10px 6px;
      text-align: center;
      font-size: 12px;
      cursor: pointer;
      background: #fff;
      font-weight: 600;
    }
    .method.active {
      border-color: var(--primary);
      background: #eff6ff;
      color: #1d4ed8;
    }

    .field {
      margin-top: 10px;
      display: none;
    }
    .field input {
      width: 100%;
      border: 1px solid #dbe3ec;
      border-radius: 10px;
      padding: 10px;
      font-size: 14px;
      font-family: 'Plus Jakarta Sans', sans-serif;
    }

    .sticky-pay {
      position: fixed;
      bottom: 0;
      left: 0;
      right: 0;
      z-index: 30;
      background: #fff;
      border-top: 1px solid #dbe3ec;
      padding: 10px 12px calc(10px + env(safe-area-inset-bottom));
    }
    .sticky-inner { max-width: 480px; margin: 0 auto; display: flex; gap: 10px; align-items: center; }
    .pay-btn {
      border: 0;
      border-radius: 12px;
      background: linear-gradient(135deg, #0b69ff, #2563eb);
      color: #fff;
      font-weight: 800;
      font-size: 15px;
      padding: 14px 18px;
      cursor: pointer;
      flex: 1;
    }

    .overlay {
      position: fixed;
      inset: 0;
      background: rgba(2, 6, 23, 0.6);
      display: none;
      align-items: center;
      justify-content: center;
      z-index: 60;
      padding: 16px;
    }
    .receipt {
      width: 100%;
      max-width: 420px;
      background: #fff;
      border-radius: 18px;
      padding: 18px;
      animation: pop .22s ease;
    }

    .done-btn {
      width: 100%;
      border: 0;
      margin-top: 12px;
      border-radius: 12px;
      background: #0f766e;
      color: #fff;
      padding: 12px;
      font-weight: 700;
      cursor: pointer;
    }

    @keyframes fadeInUp { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: translateY(0); } }
    @keyframes pop { from { transform: scale(.96); opacity: 0; } to { transform: scale(1); opacity: 1; } }
  </style>
</head>
<body>
  <div class="app">
    <div class="sticky-header">
      <div class="banner" id="banner"></div>
    </div>

    <div class="wrap">
      <section class="card" id="patientCard"></section>
      <section class="card">
        <div class="row"><strong>Invoice Details</strong><span class="muted">Line items</span></div>
        <div id="invoiceItems"></div>
      </section>

      <section class="card">
        <strong>Bill Summary</strong>
        <div id="summary"></div>
      </section>

      <section class="card">
        <div class="coin-card">
          <div>
            <strong>HIP Coins</strong>
            <div class="muted" id="coinsText"></div>
          </div>
          <div id="coinToggle" class="switch" role="button" aria-label="Toggle coins"></div>
        </div>
      </section>

      <section class="card">
        <strong>Payment Method</strong>
        <div class="methods" id="methods"></div>
        <div class="field" id="upiField"><input id="upiInput" placeholder="Enter UPI ID (example@bank)" /></div>
        <div class="field" id="cardField">
          <input id="cardNumber" placeholder="Card Number" style="margin-bottom: 8px;">
          <div class="row">
            <input id="cardExpiry" placeholder="MM/YY">
            <input id="cardCvv" placeholder="CVV">
          </div>
        </div>
      </section>
    </div>
  </div>

  <div class="sticky-pay">
    <div class="sticky-inner">
      <div>
        <div class="muted">Payable</div>
        <div class="mono" id="payableAmount" style="font-size:20px;font-weight:700;">Rs 0.00</div>
        <div class="muted" id="coinSavings"></div>
      </div>
      <button class="pay-btn" id="payBtn">Pay Now</button>
    </div>
  </div>

  <div class="overlay" id="successOverlay">
    <div class="receipt">
      <h3 style="margin:0 0 10px;">Payment Successful</h3>
      <div id="receiptBody"></div>
      <button class="done-btn" id="doneBtn">Done</button>
    </div>
  </div>

<script>
(function () {
  const query = new URLSearchParams(window.location.search);
  const isLocal = ['localhost', '127.0.0.1'].includes(window.location.hostname);

  if (!query.toString() && isLocal) {
    const demo = {
      invoice_id: '10482', amount: '5175.00', person_id: '21', primary_person_id: '15', person_name: 'Priya Sharma',
      member_id: 'HIP-000021', service_types: 'procedure,labTest,pharmacy', subtotal: '4500.00', total_gst: '225.00',
      service_charges: '135.00', gateway_charges: '90.00', discount: '150.00', coins_balance: '240', coins_value: '24.00',
      coins_earned: '52', prescription: '1', token: 'demo-token',
      invoice_details: JSON.stringify({ procedures:[{name:'Knee Arthroscopy',amount:'2500',discount_amount:'2300'}], labTest:[{name:'CBC',amount:'400',discount_amount:'350'}], pharmacy:{amount:'1850'} })
    };
    location.search = new URLSearchParams(demo).toString();
    return;
  }

  function num(v) { const n = parseFloat(v); return Number.isFinite(n) ? n : 0; }
  function money(v) { return 'Rs ' + num(v).toFixed(2); }
  function esc(v) { return String(v ?? '').replace(/[&<>"']/g, s => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[s])); }

  const data = {
    invoiceId: query.get('invoice_id') || '',
    personId: query.get('person_id') || '',
    primaryPersonId: query.get('primary_person_id') || '',
    personName: query.get('person_name') || 'Patient',
    memberId: query.get('member_id') || '-',
    serviceTypes: (query.get('service_types') || '').split(',').filter(Boolean),
    subtotal: num(query.get('subtotal')),
    totalGst: num(query.get('total_gst')),
    serviceCharges: num(query.get('service_charges')),
    gatewayCharges: num(query.get('gateway_charges')),
    discount: num(query.get('discount')),
    amount: num(query.get('amount')),
    coinsBalance: parseInt(query.get('coins_balance') || '0', 10) || 0,
    coinsValue: num(query.get('coins_value')),
    coinsEarned: parseInt(query.get('coins_earned') || '0', 10) || 0,
    prescription: query.get('prescription') === '1',
    token: query.get('token') || '',
    invoiceDetails: (() => {
      try { return JSON.parse(query.get('invoice_details') || '{}'); } catch { return {}; }
    })(),
  };

  let paymentMethod = 'upi';
  let coinsEnabled = false;
  let payable = data.amount;

  const banner = document.getElementById('banner');
  const patientCard = document.getElementById('patientCard');
  const invoiceItems = document.getElementById('invoiceItems');
  const summary = document.getElementById('summary');
  const coinToggle = document.getElementById('coinToggle');
  const coinsText = document.getElementById('coinsText');
  const payableAmount = document.getElementById('payableAmount');
  const coinSavings = document.getElementById('coinSavings');
  const methods = document.getElementById('methods');
  const upiField = document.getElementById('upiField');
  const cardField = document.getElementById('cardField');
  const payBtn = document.getElementById('payBtn');
  const successOverlay = document.getElementById('successOverlay');
  const receiptBody = document.getElementById('receiptBody');
  const doneBtn = document.getElementById('doneBtn');

  const methodList = [
    { id: 'upi', label: 'UPI' }, { id: 'card', label: 'Card' }, { id: 'net_banking', label: 'Net Banking' },
    { id: 'wallet', label: 'Wallet' }, { id: 'cash', label: 'Cash' }, { id: 'emi', label: 'EMI' }
  ];

  const typeClass = {
    procedure: 't-procedure', labtest: 't-labtest', package: 't-package', pharmacy: 't-pharmacy'
  };

  const displayType = {
    procedure: 'Procedure', labtest: 'Lab Test', package: 'Package', pharmacy: 'Pharmacy'
  };

  function flattenItems(details) {
    const out = [];
    Object.keys(details || {}).forEach((k) => {
      const key = k.toLowerCase();
      if (Array.isArray(details[k])) {
        details[k].forEach((item) => out.push({ type: key, name: item.name || displayType[key] || k, amount: num(item.amount), discountAmount: num(item.discount_amount || item.amount) }));
      } else if (key === 'pharmacy' && typeof details[k] === 'object') {
        out.push({ type: 'pharmacy', name: 'Pharmacy Bill', amount: num(details[k].amount), discountAmount: num(details[k].amount) });
      }
    });
    return out;
  }

  function recalc() {
    const discount = coinsEnabled ? Math.min(data.coinsValue, data.amount) : 0;
    payable = Math.max(0, data.amount - discount);
    payableAmount.textContent = money(payable);
    coinSavings.textContent = discount > 0 ? ('Coins applied: -' + money(discount)) : 'Coins not applied';
  }

  function render() {
    const now = new Date();
    banner.innerHTML = '<h1>Invoice #' + esc(data.invoiceId) + ' | ' + money(data.amount) + '</h1>' +
      '<p>' + esc(data.personName) + ' | ' + now.toLocaleString() + '</p>';

    const tags = data.serviceTypes.map((t) => {
      const key = t.toLowerCase();
      return '<span class="tag ' + (typeClass[key] || 't-procedure') + '">' + esc(displayType[key] || t) + '</span>';
    }).join('');

    patientCard.innerHTML =
      '<div class="row"><strong>' + esc(data.personName) + '</strong><span class="mono">' + esc(data.memberId) + '</span></div>' +
      '<div class="tags">' + tags + (data.prescription ? '<span class="pill">Prescription Added</span>' : '') + '</div>';

    const items = flattenItems(data.invoiceDetails);
    if (!items.length) {
      invoiceItems.innerHTML = '<div class="muted" style="margin-top:8px;">No item data found.</div>';
    } else {
      invoiceItems.innerHTML = items.map((it) => {
        const save = Math.max(0, it.amount - it.discountAmount);
        return '<div class="item">' +
          '<div class="row"><strong>' + esc(it.name) + '</strong><span class="tag ' + (typeClass[it.type] || 't-procedure') + '">' + esc(displayType[it.type] || it.type) + '</span></div>' +
          '<div class="row muted" style="margin-top:4px;"><span>Original: <span class="mono">' + money(it.amount) + '</span></span>' +
          '<span>Discounted: <span class="mono" style="color:var(--ok)">' + money(it.discountAmount) + '</span></span></div>' +
          (save > 0 ? '<div class="muted" style="margin-top:4px;color:var(--ok);">Savings: ' + money(save) + '</div>' : '') +
          '</div>';
      }).join('');
    }

    summary.innerHTML =
      '<div class="summary-row"><span>Subtotal</span><span class="mono">' + money(data.subtotal) + '</span></div>' +
      '<div class="summary-row"><span>GST</span><span class="mono">' + money(data.totalGst) + '</span></div>' +
      '<div class="summary-row"><span>Service Charges</span><span class="mono">' + money(data.serviceCharges) + '</span></div>' +
      '<div class="summary-row"><span>Gateway Charges</span><span class="mono">' + money(data.gatewayCharges) + '</span></div>' +
      '<div class="summary-row"><span>Discount</span><span class="mono">-' + money(data.discount) + '</span></div>' +
      '<div class="summary-row summary-total"><span>Grand Total</span><span class="mono">' + money(data.amount) + '</span></div>';

    coinsText.textContent = data.coinsBalance + ' coins available | Value ' + money(data.coinsValue);

    methods.innerHTML = methodList.map((m) =>
      '<button class="method ' + (paymentMethod === m.id ? 'active' : '') + '" data-method="' + m.id + '">' + m.label + '</button>'
    ).join('');

    methods.querySelectorAll('.method').forEach((btn) => {
      btn.addEventListener('click', function () {
        paymentMethod = this.getAttribute('data-method');
        render();
      });
    });

    upiField.style.display = paymentMethod === 'upi' ? 'block' : 'none';
    cardField.style.display = paymentMethod === 'card' ? 'block' : 'none';

    recalc();
  }

  coinToggle.addEventListener('click', function () {
    coinsEnabled = !coinsEnabled;
    coinToggle.classList.toggle('on', coinsEnabled);
    recalc();
  });

  payBtn.addEventListener('click', async function () {
    const upiId = (document.getElementById('upiInput').value || '').trim();
    if (paymentMethod === 'upi' && !/^[\w.-]{2,}@[\w.-]{2,}$/.test(upiId)) {
      alert('Please enter a valid UPI ID.');
      return;
    }

    payBtn.disabled = true;
    payBtn.textContent = 'Processing...';

    const body = {
      invoice_id: parseInt(data.invoiceId, 10),
      person_id: parseInt(data.personId, 10),
      primary_person_id: parseInt(data.primaryPersonId, 10),
      payment_method: paymentMethod,
      total_amount: Number(payable.toFixed(2)),
      original_amount: Number(data.amount.toFixed(2)),
      coins_applied: coinsEnabled ? data.coinsBalance : 0,
      coins_discount_amount: coinsEnabled ? Number(Math.min(data.coinsValue, data.amount).toFixed(2)) : 0,
      upi_id: paymentMethod === 'upi' ? upiId : null,
      service_types: data.serviceTypes,
      status: 'completed',
      token: data.token
    };

    const apiBase = query.get('api_base') || window.location.origin;
    const devMode = isLocal;

    try {
      let result;

      if (devMode) {
        await new Promise((r) => setTimeout(r, 1600));
        result = {
          success: true,
          data: {
            transaction_id: 'TXN-' + String(Math.floor(10000000 + Math.random() * 89999999)),
            invoice_id: body.invoice_id,
            amount_paid: body.total_amount,
            payment_method: body.payment_method,
            coins_applied: body.coins_applied,
            coins_earned: Math.round(body.total_amount * 0.01)
          }
        };
      } else {
        const res = await fetch(apiBase + '/api/invoices/' + encodeURIComponent(String(body.invoice_id)) + '/pay', {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json',
            'Accept': 'application/json'
          },
          body: JSON.stringify(body)
        });
        result = await res.json();
        if (!res.ok) throw new Error(result.message || 'Payment failed');
      }

      const receipt = result.data || result;
      receiptBody.innerHTML =
        '<div class="summary-row"><span>Transaction ID</span><strong class="mono">' + esc(receipt.transaction_id || '-') + '</strong></div>' +
        '<div class="summary-row"><span>Invoice</span><strong>#' + esc(data.invoiceId) + '</strong></div>' +
        '<div class="summary-row"><span>Paid Amount</span><strong class="mono">' + money(receipt.amount_paid || payable) + '</strong></div>' +
        '<div class="summary-row"><span>Method</span><strong>' + esc((receipt.payment_method || paymentMethod).toUpperCase()) + '</strong></div>' +
        '<div class="summary-row"><span>Coins Applied</span><strong>' + esc(String(receipt.coins_applied || 0)) + '</strong></div>' +
        '<div class="summary-row"><span>Coins Earned</span><strong>' + esc(String(receipt.coins_earned || data.coinsEarned)) + '</strong></div>';

      successOverlay.style.display = 'flex';
    } catch (err) {
      alert(err.message || 'Unable to process payment.');
    } finally {
      payBtn.disabled = false;
      payBtn.textContent = 'Pay Now';
    }
  });

  doneBtn.addEventListener('click', function () {
    try {
      if (window.flutter_inappwebview && typeof window.flutter_inappwebview.callHandler === 'function') {
        window.flutter_inappwebview.callHandler('paymentDone');
      }
    } catch (e) {}

    try {
      if (window.ReactNativeWebView && typeof window.ReactNativeWebView.postMessage === 'function') {
        window.ReactNativeWebView.postMessage(JSON.stringify({ type: 'paymentDone', invoice_id: data.invoiceId }));
      }
    } catch (e) {}

    history.back();
  });

  render();
})();
</script>
</body>
</html>
